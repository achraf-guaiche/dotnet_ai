version: '3.9'

services:
  # ── MySQL 8 ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: formations-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPasswordFort!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-formations_db}
      MYSQL_USER: ${MYSQL_USER:-formations_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-UserPasswordFort!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootPasswordFort!}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - formations-net

  # ── API .NET 8 ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: formations-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=server=mysql;port=3306;database=${MYSQL_DATABASE:-formations_db};user=${MYSQL_USER:-formations_user};password=${MYSQL_PASSWORD:-UserPasswordFort!};AllowPublicKeyRetrieval=true;SslMode=none
      - Jwt__Key=${Jwt__Key:-CHANGEME_DEV_KEY_MIN_32_CHARS_XXXXXXXXX}
      - Jwt__Issuer=${Jwt__Issuer:-FormationsPlatform}
      - Jwt__Audience=${Jwt__Audience:-FormationsUsers}
      - AvatarIA__Provider=${AvatarIA__Provider:-mock}
      - AvatarIA__ApiKey=${AvatarIA__ApiKey:-}
      - LLM__ApiKey=${LLM__ApiKey:-}
      - Email__Host=${Email__Host:-smtp.gmail.com}
      - Email__Username=${Email__Username:-}
      - Email__Password=${Email__Password:-}
      - Email__From=${Email__From:-noreply@formations.local}
      - App__BaseUrl=http://localhost:5000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
    networks:
      - formations-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Blazor Web Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.Web
    container_name: formations-web
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - formations-net

volumes:
  mysql_data:
  api_logs:

networks:
  formations-net:
    driver: bridge
